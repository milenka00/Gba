<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Brilloteo Mobile</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Courier New, monospace;
    text-align:center;
}

canvas{
    background:linear-gradient(#ff9a9e,#fad0c4);
    display:block;
    margin:auto;
    image-rendering:pixelated;
}

#title{
    color:yellow;
    font-size:28px;
    text-shadow:2px 2px red;
    margin-top:10px;
}

.controls{
    position:fixed;
    bottom:20px;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 40px;
}

.btn{
    width:80px;
    height:80px;
    border-radius:50%;
    border:none;
    font-size:30px;
    background:#ff0077;
    color:white;
    box-shadow:0 0 20px #ff00aa;
}

.btn:active{
    transform:scale(0.9);
}
</style>
</head>

<body>

<div id="title">🏍 BRILLOTEO 🏁</div>
<canvas id="game" width="350" height="600"></canvas>

<div class="controls">
    <button class="btn" id="left">⬅</button>
    <button class="btn" id="right">➡</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
    x: 150,
    y: 500,
    width: 50,
    height: 60,
    speed: 6
};

let obstacles = [];
let score = 0;
let gameOver = false;

function drawPlayer(){
    ctx.fillStyle="green";
    ctx.fillRect(player.x, player.y, player.width, player.height);
}

function drawObstacles(){
    ctx.fillStyle="red";
    obstacles.forEach(ob=>{
        ctx.fillRect(ob.x, ob.y, ob.width, ob.height);
    });
}

function moveObstacles(){
    obstacles.forEach(ob=>{
        ob.y += 5;
    });
    obstacles = obstacles.filter(ob=>ob.y < canvas.height);
}

function createObstacle(){
    let x = Math.random() * (canvas.width - 50);
    obstacles.push({x:x, y:-60, width:50, height:60});
}

function detectCollision(){
    obstacles.forEach(ob=>{
        if(
            player.x < ob.x + ob.width &&
            player.x + player.width > ob.x &&
            player.y < ob.y + ob.height &&
            player.y + player.height > ob.y
        ){
            gameOver = true;
        }
    });
}

function drawScore(){
    ctx.fillStyle="white";
    ctx.font="20px Courier New";
    ctx.fillText("Puntos: "+score,10,30);
}

function gameLoop(){
    if(gameOver){
        ctx.fillStyle="white";
        ctx.font="30px Courier New";
        ctx.fillText("GAME OVER",70,300);
        return;
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawPlayer();
    drawObstacles();
    moveObstacles();
    detectCollision();
    drawScore();

    score++;
    requestAnimationFrame(gameLoop);
}

document.getElementById("left").addEventListener("touchstart",()=>{
    if(player.x>0){
        player.x -= player.speed*3;
    }
});

document.getElementById("right").addEventListener("touchstart",()=>{
    if(player.x < canvas.width-player.width){
        player.x += player.speed*3;
    }
});

setInterval(createObstacle,1200);
gameLoop();
</script>

</body>
</html>
