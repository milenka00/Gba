
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Croco Adventure</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:monospace;
}

canvas{
    display:block;
    background:linear-gradient(#87CEEB,#d0f4ff);
}

.controls{
    position:fixed;
    bottom:15px;
    width:100%;
    display:flex;
    justify-content:space-around;
}

.btn{
    width:65px;
    height:65px;
    border-radius:50%;
    border:none;
    font-size:20px;
    background:#ff0077;
    color:white;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div class="controls">
    <button class="btn" id="left">⬅</button>
    <button class="btn" id="jump">⬆</button>
    <button class="btn" id="attack">💥</button>
    <button class="btn" id="right">➡</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gravity = 0.6;
let cameraX = 0;
let keys = {};

let crocoImg = new Image();
crocoImg.src = "croco.png";

let player = {
    x:100,
    y:200,
    width:80,
    height:80,
    vx:0,
    vy:0,
    speed:4,
    jumpPower:-12,
    jumps:0,
    maxJumps:2,
    lives:3,
    health:100,
    attacking:false
};

let platforms = [
    {x:0,y:canvas.height-60,width:3000,height:60},
    {x:400,y:canvas.height-200,width:200,height:20},
    {x:800,y:canvas.height-280,width:200,height:20}
];

let enemies = [
    {x:700,y:canvas.height-100,width:60,height:60,dir:1,alive:true}
];

function drawPlayer(){
    ctx.drawImage(crocoImg, player.x-cameraX, player.y, player.width, player.height);
}

function drawPlatforms(){
    ctx.fillStyle="#2ecc71";
    platforms.forEach(p=>{
        ctx.fillRect(p.x-cameraX,p.y,p.width,p.height);
    });
}

function drawEnemies(){
    ctx.fillStyle="red";
    enemies.forEach(e=>{
        if(e.alive)
        ctx.fillRect(e.x-cameraX,e.y,e.width,e.height);
    });
}

function updatePlayer(){
    player.vy += gravity;
    player.y += player.vy;
    player.x += player.vx;

    platforms.forEach(p=>{
        if(
            player.x < p.x+p.width &&
            player.x+player.width > p.x &&
            player.y < p.y+p.height &&
            player.y+player.height > p.y
        ){
            if(player.vy>0){
                player.y = p.y-player.height;
                player.vy=0;
                player.jumps=0;
            }
        }
    });

    if(keys["left"]) player.vx=-player.speed;
    else if(keys["right"]) player.vx=player.speed;
    else player.vx=0;

    cameraX = player.x - canvas.width/2;
}

function updateEnemies(){
    enemies.forEach(e=>{
        if(!e.alive) return;

        e.x += 2*e.dir;
        if(e.x < 600 || e.x > 900) e.dir*=-1;

        if(
            player.x < e.x+e.width &&
            player.x+player.width > e.x &&
            player.y < e.y+e.height &&
            player.y+player.height > e.y
        ){
            if(player.attacking){
                e.alive=false;
            } else {
                player.health-=10;
                player.x=100;
                player.y=200;
            }
        }
    });
}

function drawUI(){
    ctx.fillStyle="white";
    ctx.fillText("Vidas: "+player.lives,20,30);

    ctx.fillStyle="red";
    ctx.fillRect(20,50,200,20);
    ctx.fillStyle="lime";
    ctx.fillRect(20,50,player.health*2,20);
}

function gameLoop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    updatePlayer();
    updateEnemies();

    drawPlatforms();
    drawEnemies();
    drawPlayer();
    drawUI();

    if(player.health<=0){
        player.lives--;
        player.health=100;
    }

    if(player.lives>0){
        requestAnimationFrame(gameLoop);
    } else {
        ctx.fillStyle="white";
        ctx.font="40px monospace";
        ctx.fillText("GAME OVER",canvas.width/2-120,canvas.height/2);
    }
}

document.getElementById("left").addEventListener("touchstart",()=>keys["left"]=true);
document.getElementById("left").addEventListener("touchend",()=>keys["left"]=false);

document.getElementById("right").addEventListener("touchstart",()=>keys["right"]=true);
document.getElementById("right").addEventListener("touchend",()=>keys["right"]=false);

document.getElementById("jump").addEventListener("touchstart",()=>{
    if(player.jumps < player.maxJumps){
        player.vy = player.jumpPower;
        player.jumps++;
    }
});

document.getElementById("attack").addEventListener("touchstart",()=>{
    player.attacking=true;
    setTimeout(()=>player.attacking=false,300);
});

gameLoop();
</script>

</body>
</html>
